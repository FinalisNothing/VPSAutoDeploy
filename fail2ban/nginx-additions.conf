# ============================================================
# Nginx additions for fail2ban integration
# ============================================================
#
# 对照 Xray(M+H+K+A)+Nginx魔改版/nginx.conf 的具体位置说明。
# 修改后先 /nginx/sbin/nginx -t 测试，通过后再 -s reload。
#
# 安全性说明：
#   limit_req / limit_conn 仅添加到兜底的 location / 中。
#   nginx location 匹配优先级保证：所有具体前缀路径
#   (/Hvz5LOL1... XHTTP、/duhahui... CLIProxyAPI、/xasdfsd... 3x-ui
#    以及 = /502.html 等精确匹配)
#   都优先于 location /，因此不受这些限制影响。
#   deny 规则用正则匹配 . 开头的隐藏文件和已知漏洞路径，
#   正常的随机字符串前缀路径不会命中。
#
# ============================================================


# =============================================================
# 第 1 节：Rate limiting zones
# 位置：http { } 块内，第一个 server 块之前
# 即 nginx.conf 约第 44 行 (keepalive_timeout 65;) 之后、
# 第 46 行 (server { listen 80; ...) 之前
# =============================================================
#
# 使 [nginx-limit-req] jail 生效。
# key 用 $client_ip (真实 IP):
#   - 直连: 限速按真实客户端 IP
#   - CF 回源: 限速按 CF-Connecting-IP 中的用户真实 IP
#
# NOTE: limit_req 触发的 error.log "client:" 字段仍然是 $remote_addr
# (CF 回源=CF 边缘 IP), 但 CF 边缘 IP 已在 fail2ban ignoreip 中, 不会误封。

    limit_req_zone $client_ip zone=general:10m rate=30r/s;
    limit_conn_zone $client_ip zone=conn_per_ip:10m;


# =============================================================
# 第 2 节：Deny rules for sensitive paths
# 位置：server 3 (a.domain.com) 和 server 4 (b.domain.com) 各加一份
#   - server 3: 第 79 行 (location /Hvz5LOL1...) 之前
#   - server 4: 第 156 行 (location /Hvz5LOL1...) 之前
# 不要加到 server 1 (port 80) 和 server 2 (default_server)
# =============================================================
#
# 产生 error.log 条目, 被 [nginx-forbidden] jail 的 filter 捕获。

    # Block access to hidden files (except .well-known for ACME)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common vulnerability scan targets
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|\.htpasswd|wp-config\.php|xmlrpc\.php|wp-login\.php|phpmyadmin|pma|adminer|mysqladmin|cgi-bin|server-status|server-info) {
        deny all;
        access_log off;
        log_not_found off;
    }


# =============================================================
# 第 3 节：Rate limiting directives
# 位置：server 3 和 server 4 的兜底 location / { } 内部各加一份
#   - server 3: 第 102 行 (location / {) 之后，proxy_pass 之前
#   - server 4: 第 196 行 (location / {) 之后，proxy_pass 之前
# 不要加到 XHTTP / CLIProxyAPI / 3x-ui 等其他 location 中
# =============================================================
#
# rate=30r/s burst=50 对正常浏览极为宽裕，
# limit_conn 30 对单 IP 并发连接也留足余量。

    limit_req zone=general burst=50 nodelay;
    limit_conn conn_per_ip 30;
