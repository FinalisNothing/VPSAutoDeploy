# /etc/fail2ban/filter.d/nginx-scanner-ua.conf
#
# Catches requests from known malicious scanner User-Agents.
# These UA strings explicitly identify automated scanning tools
# and will never appear in legitimate browser traffic.
#
# maxretry=1 recommended - a single request with these UAs
# is conclusive evidence of scanning.
#
# Matches:
#   zgrab, l9scan, LeakIX, Nuclei, masscan, sqlmap, nikto,
#   dirbuster, gobuster, ffuf, wfuzz, httpx, silver.inc,
#   SecurityResearchBot, NetScope, python-requests,
#   Go-http-client/1.1 (but NOT /2.0 - Xray uses it), fasthttp, Hello World,
#   visionheight.com, CensysInspect, resp-size-filter, Wget,
#   OAI-SearchBot (OpenAI scanner used with direct IP)
#
# Access log format expected:
#   $client_ip - $remote_user [$time_local] "$request" $status ... "$http_user_agent"

[Definition]

# Match known malicious scanner User-Agents
# These UAs explicitly identify as scanning tools, never used by legitimate browsers
# Note: Go-http-client/1.1 is blocked (common scanner), but Go-http-client/2.0 is allowed (Xray uses it)
failregex = ^<HOST> -\s+\S+\s+"\S+ \S+ HTTP/\S+" \d+ \d+ "\S+" ".*(?:zgrab|l9scan|LeakIX|LEAKIX|Nuclei|masscan|sqlmap|nikto|dirbuster|gobuster|ffuf|wfuzz|httpx|silver\.inc|SecurityResearchBot|NetScope|python-requests|Go-http-client/1\.1|fasthttp|Hello World|visionheight\.com|CensysInspect|resp-size-filter|Wget).*"

ignoreregex =

datepattern = \[%%d/%%b/%%ExY:%%H:%%M:%%S %%z\]
