# /etc/fail2ban/filter.d/nginx-path-scan.conf
#
# Catches requests for known sensitive/exploitable paths that
# return 4xx status codes. These are hallmarks of automated
# vulnerability scanners (Nikto, Nuclei, dirsearch, etc.)
#
# This is more targeted than nginx-4xx-flood and more
# comprehensive than nginx-botsearch. It matches specific
# paths that legitimate users should never request.
#
# Access log format expected (matches your $client_ip log_format):
#   $client_ip - $remote_user [$time_local] "$request" $status ...

[Definition]

failregex = ^<HOST> -\s+\S+\s+"(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) \S*(\.(env|git|svn|DS_Store|htaccess|htpasswd|aws|docker|npmrc|bash_history|mysql_history|pgpass|netrc|streamlit)|wp-config\.php|config\.(php|yml|yaml|json|js|bak|old|inc|toml|py)|database\.yml|credentials|\.ssh|id_rsa|authorized_keys|shadow|passwd|wp-login\.php|wp-admin|wp-content/uploads|xmlrpc\.php|phpmyadmin|/pma|adminer|mysqladmin|cgi-bin|/actuator|/api-docs|/swagger|/graphql|/telescope|/_ignition|/vendor/phpunit|/debug|/console|/server-status|/server-info|/manager|/solr|/jenkins|/\.vscode|/\.idea|/Dockerfile|/docker-compose|/Makefile|/composer\.(json|lock)|/package\.json|/Gemfile|/eval-stdin|/shell|/cmd|/exec|/system|/setup\.php|/install\.php|/backup|/db\.(sql|dump)|/\.well-known/security\.txt|/SDK/webLanguage|/boaform|/remote/login|/CSCOE|/bins|/terraform|/settings\.(py|json)|/secrets|/appsettings|/proc/self|/dns-query|/query|/resolve|/GponForm|/HNAP1|/hello\.world|/geoserver|/druid|/hudson|/portal/redlion|/wordpress|/@fs/|/\+CSCOE\+|/application\.(properties|yml|yaml)|/nice%%20ports|/login\.asp|XDEBUG_SESSION_START|/FD873AC4|/xmrig|/luci|/nmaplowercheck|/evox|/sdk|/setup\.cgi|/ReportServer|/developmentserver)\S*\s+HTTP/\S+" (0|301|400|403|404|405|444|502) .*

ignoreregex = \.well-known/acme-challenge

datepattern = \[%%d/%%b/%%ExY:%%H:%%M:%%S %%z\]
