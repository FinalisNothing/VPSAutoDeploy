# /etc/fail2ban/filter.d/nginx-4xx-flood.conf
#
# Catches IPs generating excessive 4xx client errors.
# This is a volume-based filter - it doesn't care WHAT
# path was requested, only that the IP is generating
# many errors in a short time window.
#
# Use cases:
# - Directory brute-force (dirbuster, gobuster, ffuf)
# - Credential stuffing (login form probing)
# - General scanning / fuzzing
#
# Set maxretry high enough (15+) to avoid false positives
# from normal users hitting a few 404s.
#
# Access log format expected:
#   $client_ip - $remote_user [$time_local] "$request" $status ...

[Definition]

failregex = ^<HOST> -\s+\S+\s+"\S+ \S+ HTTP/\S+" (0|400|401|403|404|405|408|429|444) .*

ignoreregex = .*(favicon\.ico|robots\.txt|sitemap\.xml|\.well-known/acme-challenge|apple-touch-icon)

datepattern = \[%%d/%%b/%%ExY:%%H:%%M:%%S %%z\]
