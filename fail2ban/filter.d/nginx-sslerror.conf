# /etc/fail2ban/filter.d/nginx-sslerror.conf
#
# Catches SSL/TLS handshake failures logged by nginx:
# - ssl_reject_handshake on (default_server rejecting unknown SNI)
# - Invalid TLS versions/ciphers
# - Malformed TLS ClientHello
# - TLS downgrade probing
#
# UDS 架构局限性:
#   TCP 443 流量经 Xray → UDS → Nginx 时, ssl_reject_handshake 等
#   早期 TLS 错误的 "client:" 字段为 "unix:", 不含公网 IP,
#   本 filter 的 <HOST> 无法匹配, 因此对 UDS 转发的 TCP 流量大部分无效。
#
#   UDP 443 QUIC 直连 Nginx 时, "client:" 为真实客户端 IP,
#   filter 正常工作。
#
#   保留启用: 对 QUIC 直连仍有防护价值, 且不产生误封。
#
# Log level note: ssl_reject_handshake logs at [crit] level.
# Other SSL errors log at [info] or [crit] depending on type.
# Make sure error_log is NOT set above "crit" level.

[Definition]

failregex = SSL_do_handshake\(\) failed .+, client: <HOST>
            no "ssl_certificate" is defined .+, client: <HOST>

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?

journalmatch = _SYSTEMD_UNIT=nginx.service + _COMM=nginx
