# /etc/fail2ban/filter.d/nginx-protocol-probe.conf
#
# Catches non-HTTP protocol probes sent to HTTP ports.
# These are 100% malicious - no legitimate browser or client
# sends TLS ClientHello, SSH, RDP, MongoDB, or Redis protocol
# data to an HTTP port.
#
# All matched requests return 400 in access.log.
# maxretry=1 recommended - single occurrence is conclusive.
#
# Matches:
#   - Binary data (\x hex escapes - covers TLS, SMB, RDP and every other
#     binary protocol, since nginx logs raw bytes \x-escaped)
#   - CONNECT method (open proxy probing)
#   - SSTP_DUPLEX_POST (VPN probing)
#   - PROPFIND (WebDAV scanning)
#   - RTSP protocol probing
#   - PRI * HTTP/2.0 (HTTP/2 cleartext probing)
#   - SSH-2.0 (SSH protocol on HTTP port)
#   - Gh0st RAT C2 beacon
#   - mstshash (RDP brute force)
#   - MongoDB / Redis protocol probing
#   - MGLNDD (Microsoft scan marker)
#   - GPON shell injection
#
# Access log format expected:
#   $client_ip - $remote_user [$time_local] "$request" $status ...

[Definition]

# Match non-HTTP protocol probes and 100% malicious request methods
# These requests all return 400, and cannot come from legitimate users.
# ".*\\x" matches any \x-escaped byte in the request line, which already
# covers every binary protocol probe (TLS, SMB, RDP handshakes, ...); the
# alternatives after it are the probes that arrive as plain text.
failregex = ^<HOST> -\s+\S+\s+"(?:CONNECT |SSTP_DUPLEX_POST |PROPFIND |OPTIONS / RTSP/|PRI \*|.*\\x|.*SSH-2\.0|.*Gh0st|.*mstshash|.*MGLNDD|.*admin\.\$cmd|.*\*1|.*0;sh\+/tmp/|.*145\.ll\||.*aaaabbbb).*" 400 .*
            ^<HOST> -\s+\S+\s+"" 400 .*

ignoreregex =

datepattern = \[%%d/%%b/%%ExY:%%H:%%M:%%S %%z\]
