# /nginx/conf/nginx.conf when no scheme uses nginx: only the server blocks
# other local services keep in sites.d/ are served.
worker_processes auto;

error_log /nginx/logs/error.log;

pid /nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /nginx/logs/access.log;
    sendfile on;
    keepalive_timeout 65;

    include /nginx/conf/sites.d/*.conf;
}
