# Temporary nginx.conf used only to answer the first ACME HTTP-01 challenge
# for {{DOMAIN}}; the scheme's own nginx.conf replaces it right after.
worker_processes auto;

error_log /nginx/logs/error.log;

pid /nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /nginx/conf/sites.d/*.conf;

    server {
        listen 80;
        server_name {{DOMAIN}};

        location /.well-known/acme-challenge/ {
            alias /nginx/acme_challenge/.well-known/acme-challenge/;
        }

        location / {
            return 444;
        }
    }
}
